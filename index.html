    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Administration sécurisée pour la plateforme DMK" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <title>DMK Admin</title>

    <!-- DOM SHIELD v3 SYNCHRONE ULTRA-SÉCURISÉ -->
    <!-- Intercepte les mutations sauvages provoquées par Google Translate ou les extensions -->
    <!-- s'exécute AVANT le chargement de React pour une immunité totale -->
    <script>
      (function() {
        if (typeof Node === 'undefined' || !Node.prototype) return;
        
        var _origInsert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, refNode) {
          // Si le nœud de référence n'est plus un enfant direct de ce parent
          if (refNode && refNode.parentNode !== this) {
            try {
              return _origInsert.call(this, newNode, null);
            } catch (e) {
              return newNode;
            }
          }
          try {
            return _origInsert.call(this, newNode, refNode);
          } catch (err) {
            // Tente une insertion de secours à la fin (append)
            try {
              return _origInsert.call(this, newNode, null);
            } catch (fallbackErr) {
              return newNode;
            }
          }
        };

        var _origRemove = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child && child.parentNode !== this) {
            return child;
          }
          try {
            return _origRemove.call(this, child);
          } catch (err) {
            return child;
          }
        };

        // Nettoyage de tout ancien Service Worker zombie susceptible de bloquer les assets
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
      })();
    </script>
  </head>
  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
